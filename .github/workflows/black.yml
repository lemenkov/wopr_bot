name: black
on:
  push:
    branches: [master]
  pull_request:
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "joshua_bot.py"
          version: "~= 25.1"
